# Home Assistant's integration quality scale: https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: done
    comment: The remove/block/allow_smartphone actions are registered in async_setup (services.py).
  appropriate-polling:
    status: done
    comment: >-
      Every 60 s, a few extra polls after switching power; the link is dropped soon after each poll. While HDMI
      shows and the HDMI status sensor is enabled, that status alone is read twice between polls (every 20 s), as it
      follows a source being plugged in and out within seconds. The clock is set once a day (and when a clock poster
      appears or the UTC offset changes), right after a poll. The timers and poster settings (web_settings.py) are
      read hourly, right after a poll that finds a poster showing, only while their entities are enabled; one never
      answered is asked again after an hour, then daily. Bluetooth
      signal (disabled by default) is read from the advertisements Home Assistant already keeps, once a minute and
      whenever one changes.
  brands:
    status: done
    comment: Custom integration; the icon ships in brand/.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No requirements; the Bluetooth client is part of the integration and uses Home Assistant's bleak.
  docs-actions:
    status: done
    comment: README, "Removing or blocking smartphones".
  docs-conditions:
    status: exempt
    comment: No conditions of its own.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers of its own.
  entity-event-setup:
    status: done
    comment: >-
      Entities subscribe to the coordinator (CoordinatorEntity), except Bluetooth signal, which subscribes to Home
      Assistant's Bluetooth callbacks and a timer in async_added_to_hass and unsubscribes with async_on_remove.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Pairing ends by checking that the projector accepts commands.
  test-before-setup:
    status: done
    comment: >-
      The projector is often off, so setup uses async_refresh() and leaves the entities unavailable (the rule's
      exception for often-offline devices); a projector that rejects Home Assistant on two connections in a row
      starts reauthentication.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: README, "Weather poster" (the only option, a weather entity).
  docs-installation-parameters:
    status: done
    comment: The only field is the projector to set up; the README's Setup section covers pairing.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs a failing projector once and again when it answers.
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: >-
      Pairs again when the projector no longer accepts Home Assistant, unless a check first finds it accepted again.
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: Smartphone names and Bluetooth addresses are redacted.
  discovery-update-info:
    status: exempt
    comment: >-
      Bluetooth: the address is the unique ID and the only stored data; the integration follows whichever adapter
      or proxy currently sees the projector.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One projector per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >-
      Disabled by default: the timers (web_settings.py), which go through the Bluetooth tunnel to the HTTP API by a
      route the app never takes (Sync clock, Initial mode and Slideshow interval are enabled: the app sends them
      through the tunnel too), Usage time, of interest to few, and Bluetooth signal, which changes with every
      reading (once a minute) and is for diagnosing the connection. Usage time is also rounded to 0.1 h, so where it
      is enabled it changes every 6 minutes of use rather than on every poll. The other entities change only with
      the projector's settings or status (one poll a minute, unchanged states are not written).
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: >-
      Nothing to reconfigure: the only setup data is the projector's Bluetooth address, which is also its unique ID;
      pairing again goes through reauthentication.
  repair-issues:
    status: done
    comment: >-
      A projector whose internal link is stuck raises a repair issue that explains the RESET button; its repair flow
      tries Restart first (not yet tried on a stuck projector) and says whether that helped. A projector unreachable
      for 20 minutes because another device is probably connected to it (when last seen on its charger), or because
      it refuses connections while it is heard well, raises one that says what to try; both go away once a poll
      reaches it.
  stale-devices:
    status: exempt
    comment: One projector per config entry; it is removed with the entry.

  # Platinum
  async-dependency:
    status: done
    comment: The Bluetooth client (client.py) is asyncio-based, on bleak and bleak-retry-connector.
  inject-websession:
    status: exempt
    comment: Everything goes over Bluetooth; the integration makes no HTTP requests of its own.
  strict-typing:
    status: done
    comment: mypy --strict in CI (configuration in pyproject.toml).

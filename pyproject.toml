[project]
name = "ha-sony-lspx-p1"
version = "1.8.0"
description = "Home Assistant integration for the Sony LSPX-P1 portable ultra short throw projector (Bluetooth LE)"
requires-python = ">=3.13"
license = "BSD-3-Clause"

[dependency-groups]
dev = [
  "mypy",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/sony_lspx_p1"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Home Assistant's quality scale asks for more than 95% in every module; this checks the total.
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast reads D-Bus signatures ("o", "s", ...) from quoted annotations.
"custom_components/sony_lspx_p1/bluez_agent.py" = ["F821", "UP037"]
"tests/*" = ["PLR2004", "S101"]
"tools/*" = ["PLC0415", "E402"]
# Translation tables: long natural-language lines and typographic quotes are intended.
"tools/translations.py" = ["E501", "RUF001"]
# Brand artwork generators: geometry-heavy code with long coordinate lines and short names.
"tools/brand/**" = ["E501", "E741", "B007", "PLW0108"]

[tool.mypy]
files = ["custom_components/sony_lspx_p1"]
explicit_package_bases = true
# Home Assistant runs on Linux; on macOS mypy would skip the BlueZ code behind sys.platform checks.
platform = "linux"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]

[[tool.mypy.overrides]]
# Home Assistant re-exports names (e.g. MediaPlayerState) without listing them in __all__.
module = ["homeassistant.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# dbus-fast reads D-Bus signatures ("o", "s", ...) from string annotations, which are not Python names.
module = ["custom_components.sony_lspx_p1.bluez_agent"]
disable_error_code = ["name-defined"]

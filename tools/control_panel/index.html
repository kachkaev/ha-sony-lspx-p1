<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSPX-P1 Control</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #fffefb; --text: #1d1d1b; --muted: #77746c; --line: #e4e1d8;
    --accent: #d9771f; --accent-soft: #f6e3cf; --ok: #2f8a4c; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #20201e; --text: #ecebe6; --muted: #9a978e; --line: #34332f;
            --accent: #ef8f3a; --accent-soft: #3a2a1b; --ok: #5cbf7a; --err: #e8665a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .pill { font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.busy { background: var(--accent); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; margin-bottom: 12px; }
  section h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
  .row { padding: 10px 0; border-top: 1px solid var(--line); }
  section h2 + .row { border-top: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label { font-size: 15px; }
  .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; text-align: right; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.step { width: 34px; padding: 4px 0; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 6px; }
  .seg button { flex: 1; border: 0; border-radius: 0; padding: 7px 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  label.auto { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .switch { display: flex; align-items: center; gap: 8px; }
  select { font: inherit; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
  .disabled { opacity: .45; }
  #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 160px; overflow: auto; padding: 8px 0; }
  #log .bad { color: var(--err); }
  .note { font-size: 12px; color: var(--muted); padding: 0 0 10px; }
</style>
</head>
<body>
<main>
  <header>
    <span id="dot" class="dot"></span>
    <h1>LSPX-P1</h1>
    <span class="pill" id="meta">connecting…</span>
    <button id="refresh" title="Re-read everything">↻</button>
  </header>

  <section>
    <h2>Power</h2>
    <div class="row head">
      <span class="label">Projection on</span>
      <input type="checkbox" data-bool="power">
    </div>
  </section>

  <section>
    <h2>Sound</h2>
    <div class="row">
      <div class="head"><span class="label">Volume</span><span class="val" data-show="volume">–</span></div>
      <div class="ctl"><input type="range" min="0" max="100" data-num="volume"></div>
    </div>
    <div class="row head">
      <span class="label">xLOUD</span>
      <input type="checkbox" data-bool="xloud">
    </div>
  </section>

  <section>
    <h2>Projection</h2>
    <div class="row">
      <div class="head"><span class="label">Brightness</span>
        <label class="auto">Auto <input type="checkbox" data-bool="auto_brightness"></label></div>
      <div class="ctl"><input type="range" min="40" max="100" data-num="brightness"><span class="val" data-show="brightness">–</span></div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Focus</span>
        <label class="auto">Auto <input type="checkbox" data-bool="focus_assist"></label></div>
      <div class="ctl">
        <input type="range" min="-383" max="149" data-num="focus"><span class="val" data-show="focus">–</span>
        <button class="step" data-step="focus" data-delta="-5" title="Far">‹</button>
        <button class="step" data-step="focus" data-delta="5" title="Near">›</button>
      </div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Keystone</span></div>
      <div class="ctl">
        <input type="range" min="-30" max="30" data-num="keystone"><span class="val" data-show="keystone">–</span>
        <button class="step" data-step="keystone" data-delta="-1">‹</button>
        <button class="step" data-step="keystone" data-delta="1">›</button>
      </div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Rotate screen</span>
        <label class="auto">Auto <input type="checkbox" data-bool="auto_direction"></label></div>
      <div class="seg" data-seg="direction">
        <button data-v="2">R</button><button data-v="1">ᴚ (180°)</button>
        <button data-v="0">Mirror H</button><button data-v="3">Mirror V</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Picture</h2>
    <div class="row head">
      <span class="label">Mode</span>
      <select data-select="picture_mode">
        <option value="0">Preset 1</option><option value="1">Preset 2</option><option value="2">Preset 3</option>
        <option value="16">Custom 1</option><option value="17">Custom 2</option>
      </select>
    </div>
    <div class="note">Picture sliders may only take effect in a Custom mode.</div>
    <div class="row">
      <div class="head"><span class="label">Brightness</span><span class="val" data-show="picture_brightness">–</span></div>
      <div class="ctl"><input type="range" min="100" max="160" data-num="picture_brightness" data-range="brightness"></div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Contrast</span><span class="val" data-show="picture_contrast">–</span></div>
      <div class="ctl"><input type="range" min="10" max="40" data-num="picture_contrast" data-range="contrast"></div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Saturation</span><span class="val" data-show="picture_saturation">–</span></div>
      <div class="ctl"><input type="range" min="0" max="120" data-num="picture_saturation" data-range="saturation"></div>
    </div>
    <div class="row">
      <div class="head"><span class="label">Sharpness</span><span class="val" data-show="picture_sharpness">–</span></div>
      <div class="ctl"><input type="range" min="0" max="15" data-num="picture_sharpness" data-range="sharpness"></div>
    </div>
  </section>

  <section>
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
let state = {};
let busy = 0;

function setDot(kind) { $("#dot").className = "dot " + kind; }
function logLine(text, bad) {
  const div = document.createElement("div");
  div.textContent = new Date().toLocaleTimeString() + "  " + text;
  if (bad) div.className = "bad";
  $("#log").prepend(div);
}

function render() {
  const s = state;
  $$("[data-num]").forEach(el => { const k = el.dataset.num; if (s[k] !== undefined && document.activeElement !== el) el.value = s[k]; });
  $$("[data-show]").forEach(el => { const k = el.dataset.show; if (s[k] !== undefined) el.textContent = s[k]; });
  $$("[data-bool]").forEach(el => {
    const k = el.dataset.bool;
    if (k === "auto_brightness" && s[k]) el.checked = s[k].by_illumination || s[k].by_ac;
    else if (s[k] !== undefined) el.checked = !!s[k];
  });
  $$("[data-select]").forEach(el => { const k = el.dataset.select; if (s[k] !== undefined) el.value = String(s[k]); });
  $$("[data-seg]").forEach(seg => $$("button", seg).forEach(b => b.classList.toggle("on", Number(b.dataset.v) === s[seg.dataset.seg])));
  if (s.focus_limits) { const f = $('[data-num="focus"]'); f.min = s.focus_limits.far; f.max = s.focus_limits.near; }
  if (s.prj_range) {
    const b = $('[data-num="brightness"]'); b.min = s.prj_range.brightness[0]; b.max = s.prj_range.brightness[1];
    const k = $('[data-num="keystone"]'); k.min = s.prj_range.keystone[0]; k.max = s.prj_range.keystone[1];
  }
  if (s.picture_range) $$("[data-range]").forEach(el => { const r = s.picture_range[el.dataset.range]; if (r) { el.min = r[0]; el.max = r[1]; } });
  // Manual controls dim when their Auto is on
  const dim = (sel, on) => $(sel).closest(".row").querySelector(".ctl").classList.toggle("disabled", !!on);
  dim('[data-num="focus"]', s.focus_assist);
  const bat = s.battery ? `🔋 ${s.battery.level}%` : "";
  $("#meta").textContent = [bat, s.soc_version ? "fw " + s.soc_version : ""].filter(Boolean).join(" · ");
}

async function refresh() {
  setDot("busy");
  try {
    const r = await fetch("/api/state");
    const j = await r.json();
    state = j.state;
    render();
    const errs = Object.entries(j.errors);
    errs.forEach(([k, v]) => logLine(`read ${k}: ${v}`, true));
    setDot(errs.length ? "err" : "ok");
    if (!errs.length) logLine("read all settings");
  } catch (e) { setDot("err"); logLine("refresh failed: " + e, true); }
}

async function send(name, value) {
  busy++; setDot("busy");
  try {
    const r = await fetch("/api/set", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, value }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    if (j.value !== null && j.value !== undefined) state[name] = j.value;
    else state[name] = value;
    logLine(`${name} → ${JSON.stringify(value)}  (reads back ${JSON.stringify(state[name])})`);
    setDot("ok");
  } catch (e) { logLine(`${name} → ${JSON.stringify(value)} failed: ${e.message}`, true); setDot("err"); }
  finally { busy--; render(); }
}

$$("[data-num]").forEach(el => {
  const show = $(`[data-show="${el.dataset.num}"]`);
  el.addEventListener("input", () => { if (show) show.textContent = el.value; });
  el.addEventListener("change", () => send(el.dataset.num, Number(el.value)));
});
$$("[data-bool]").forEach(el => el.addEventListener("change", () => send(el.dataset.bool, el.checked)));
$$("[data-select]").forEach(el => el.addEventListener("change", () => send(el.dataset.select, Number(el.value))));
$$("[data-seg]").forEach(seg => $$("button", seg).forEach(b => b.addEventListener("click", () => send(seg.dataset.seg, Number(b.dataset.v)))));
$$("[data-step]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.step, input = $(`[data-num="${k}"]`);
  const v = Math.max(Number(input.min), Math.min(Number(input.max), Number(state[k] ?? input.value) + Number(b.dataset.delta)));
  input.value = v; send(k, v);
}));
$("#refresh").addEventListener("click", refresh);
refresh();
</script>
</body>
</html>

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # monthly from scheduled.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    # Marketplace (formerly HACS) validation; it only runs on public repositories.
    name: Marketplace validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

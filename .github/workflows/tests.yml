name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv pip install -r requirements_test.txt
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .
      - run: uv run --no-project mypy
      - run: google-chrome --version # the runner's Chrome, for the card tests (tests/test_card_ui.py)
      - run: uv run --no-project pytest -q --cov
